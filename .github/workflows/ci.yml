# Every push to development or main, and every pull request into either, runs
# four jobs in parallel. Dependabot aims its pull requests at development, so
# without that branch here they would arrive with no checks of their own. A ruleset on main can require them all to pass
# (see docs/security/RUNBOOK.md, "GitHub settings").
#
# Supply-chain hygiene in the workflow itself:
# - The job token can read the code and nothing else (least privilege).
# - Actions are pinned to a full commit SHA, not a tag: a tag can be moved to
#   different code; a commit can't. Dependabot keeps the pins current.
# - The scanners run from container images pinned by digest, for the same
#   reason.
# - checkout doesn't leave its credentials in the workspace for later steps.

name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, tests, build, dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exactly what the lockfile says
        run: npm ci
      # The gate is on what ships. An advisory in the linter or the test runner
      # is real but is not reachable by a user of this app, and it can sit
      # unfixable for weeks when upstream has published no patched version —
      # which must not be able to block a release. Dev advisories are still
      # printed below, and recorded as an accepted risk in the threat model.
      - name: No known high or critical vulnerabilities in shipped code
        run: npm audit --omit=dev --audit-level=high
      - name: Advisories in development dependencies, for information
        run: npm audit --audit-level=high || true
      - name: Every package is signed by the registry
        run: npm audit signatures
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Database tests (three-member replica set)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Linux kernel
        run: uname -r
      # Generates throwaway passwords for this run only, then starts the set.
      - run: npm run db:up
      - run: npm run test:db
      - name: Database logs, if something failed
        if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down --volumes

  secrets:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the last
          persist-credentials: false
      - name: gitleaks v8.30.1
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep 1.176.0
        run: >
          docker run --rm -v "$PWD:/src:ro" -w /src
          semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
          semgrep scan --metrics=off --error
          --config p/typescript --config p/nodejs --config p/secrets --config p/owasp-top-ten --config p/react
          --exclude node_modules --exclude docs/nosql/explain
          app components lib scripts docker
