# Dependabot opens pull requests to keep dependencies current (threat T8). They
# target `development`, like any other change, and CI checks each one before
# it can reach main.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine updates; majors come one by one.
      minor-and-patch:
        update-types: [minor, patch]
    # Two majors that Next's own lint config can't take yet (tried 2026-09-22):
    # typescript-eslint refuses TypeScript 7 outright, and ESLint 10 removed an
    # API that the eslint-plugin-react bundled in eslint-config-next still
    # calls, so linting dies on the first file. Minor and patch updates to both
    # still arrive. Revisit when eslint-config-next ships support: a Next
    # release that allows eslint 10, and typescript-eslint >= 8.x with TS 7.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly

  # The mongo image in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: development
    schedule:
      interval: monthly
