<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Horizon">
  <!-- Master source for every Horizon icon. The raster variants in public/
       (icon-192, icon-512, icon-maskable-512) and app/apple-icon.png and
       app/favicon.ico are all rendered from this file — see README. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdefff"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#a5e8ff"/>
    </linearGradient>
    <clipPath id="plateClip"><rect width="512" height="512" rx="114"/></clipPath>
    <clipPath id="skyClip"><rect x="0" y="0" width="512" height="300"/></clipPath>
  </defs>
  <g clip-path="url(#plateClip)">
    <rect width="512" height="512" fill="url(#plate)"/>
    <ellipse cx="256" cy="302" rx="235" ry="200" fill="url(#halo)"/>
    <!-- The sun: the goal, clipped to sit exactly on the horizon. -->
    <circle cx="256" cy="300" r="110" fill="url(#sun)" clip-path="url(#skyClip)"/>
    <!-- The horizon doubles as the track's progress bar. The dark plate under
         it keeps the bar readable where it crosses the sun. -->
    <rect x="58" y="284" width="396" height="38" rx="19" fill="#07070a"/>
    <rect x="64" y="290" width="384" height="26" rx="13" fill="#0ea5e9" opacity="0.24"/>
    <rect x="64" y="290" width="238" height="26" rx="13" fill="url(#bar)"/>
  </g>
</svg>
